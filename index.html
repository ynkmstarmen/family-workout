<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭锻炼计划工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fb;color:#1f2937;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:20px}
/* 登录 */
#login{min-height:90vh;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:16px;padding:40px 32px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center;width:100%;max-width:380px}
.login-card h1{font-size:24px;margin-bottom:8px}
.login-card p{color:#6b7280;font-size:14px;margin-bottom:20px}
.login-card input{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:10px;font-size:16px;margin-bottom:12px}
.login-card button{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:16px;cursor:pointer}
.login-card button:hover{background:#1d4ed8}
#login-err{color:#dc2626;font-size:13px;min-height:20px;margin-top:8px}
/* 主体 */
#app{display:none}
header{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:16px;padding:28px;margin-bottom:20px}
header h1{font-size:22px;margin-bottom:6px}
header p{opacity:.9;font-size:14px}
.panel{background:#fff;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.panel h2{font-size:17px;margin-bottom:14px}
.opt-group{margin-bottom:16px}
.opt-group .label{font-size:14px;color:#6b7280;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{border:2px solid #e5e7eb;border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;transition:.15s}
.opts input{display:none}
.opts input:checked+span{font-weight:600}
.opts label:has(input:checked){border-color:#2563eb;background:#eff6ff;color:#1d4ed8}
#gen{width:100%;padding:14px;background:#16a34a;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer;margin-top:6px}
#gen:hover{background:#15803d}
/* 计划 */
.plan-head{background:#fff;border-radius:16px;padding:24px;margin:20px 0;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.plan-head h2{margin-bottom:8px}
.plan-head .tip{background:#fefce8;border:1px solid #fde68a;border-radius:10px;padding:10px 14px;font-size:13px;margin:12px 0}
.plan-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.plan-actions button{padding:10px 16px;border:2px solid #e5e7eb;background:#fff;border-radius:10px;font-size:14px;cursor:pointer}
.plan-actions button:hover{border-color:#2563eb}
.section{margin:24px 0 12px;font-size:18px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card-head{display:flex;gap:16px}
.card-head img{width:120px;height:120px;object-fit:cover;border-radius:10px;background:#f3f4f6;flex-shrink:0}
.card-title .idx{display:inline-block;background:#2563eb;color:#fff;font-size:12px;border-radius:6px;padding:2px 8px;margin-bottom:6px}
.card-title h3{font-size:17px;margin-bottom:4px}
.card-title .meta{font-size:12px;color:#6b7280;margin-bottom:6px}
.card-title .dose{font-size:15px;font-weight:600;color:#16a34a}
.card-title .rest{font-size:13px;color:#6b7280}
.card details{margin-top:10px;font-size:14px}
.card summary{cursor:pointer;color:#2563eb;font-size:14px}
.card ol{margin:8px 0 0 20px;color:#4b5563}
footer{text-align:center;color:#9ca3af;font-size:12px;padding:30px 0}
@media print{.plan-actions,header,.panel,footer,#gen{display:none}.card{break-inside:avoid;box-shadow:none;border:1px solid #e5e7eb}}
@media(max-width:600px){.card-head img{width:96px;height:96px}}
</style>
</head>
<body>
<div class="wrap">

<!-- 登录 -->
<div id="login">
  <div class="login-card">
    <h1>🏋️ 家庭锻炼计划</h1>
    <p>请输入访问密码（找分享人要）</p>
    <input type="password" id="pwd" placeholder="密码" autocomplete="off">
    <button onclick="tryLogin()">进入</button>
    <div id="login-err"></div>
  </div>
</div>

<!-- 主应用 -->
<div id="app">
  <header>
    <h1>🏋️ 家庭锻炼计划工具</h1>
    <p>选需求 → 自动生成锻炼计划（含动作演示 GIF + 中文步骤），在家就能练</p>
  </header>

  <div class="panel">
    <h2>📝 说说你的锻炼需求</h2>
    <div class="opt-group">
      <div class="label">锻炼目标（可多选）</div>
      <div class="opts">
        <label><input type="checkbox" name="goal" value="预防肌肉减少" checked><span>预防肌肉减少</span></label>
        <label><input type="checkbox" name="goal" value="下肢力量"><span>下肢力量</span></label>
        <label><input type="checkbox" name="goal" value="上肢力量"><span>上肢力量</span></label>
        <label><input type="checkbox" name="goal" value="核心稳定"><span>核心稳定</span></label>
        <label><input type="checkbox" name="goal" value="柔韧拉伸"><span>柔韧拉伸</span></label>
      </div>
    </div>
    <div class="opt-group">
      <div class="label">强度</div>
      <div class="opts">
        <label><input type="radio" name="intensity" value="easy" checked><span>轻松</span></label>
        <label><input type="radio" name="intensity" value="normal"><span>标准</span></label>
        <label><input type="radio" name="intensity" value="hard"><span>挑战</span></label>
      </div>
    </div>
    <div class="opt-group">
      <div class="label">时长</div>
      <div class="opts">
        <label><input type="radio" name="minutes" value="15" checked><span>15 分钟</span></label>
        <label><input type="radio" name="minutes" value="30"><span>30 分钟</span></label>
        <label><input type="radio" name="minutes" value="45"><span>45 分钟</span></label>
      </div>
    </div>
    <div class="opt-group">
      <div class="label">动作偏好</div>
      <div class="opts">
        <label><input type="radio" name="pref" value="static" checked><span>静态为主（如平板支撑）</span></label>
        <label><input type="radio" name="pref" value="mix"><span>动静结合</span></label>
        <label><input type="radio" name="pref" value="dynamic"><span>动态为主</span></label>
      </div>
    </div>
    <button id="gen">生成我的锻炼计划</button>
  </div>

  <div id="plan"></div>

  <footer>动作数据来自 exercises-dataset-zh（中文增强版）· 仅供家庭健身参考，身体不适请咨询医生</footer>
</div>
</div>

<script src="config.js"></script>
<script src="exercises.js"></script>
<script src="app.js"></script>
</body>
</html>
